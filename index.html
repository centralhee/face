<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeRoStudio | 网站建设中</title>
    <style>
        /* 全局重置与字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* 防止滚动 */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 动态背景 Canvas */
        #waveCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.4;
        }

        /* 主容器：磨砂玻璃效果 */
        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 4rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
            animation: fadeIn 1.5s ease-out;
        }

        /* 品牌名称 */
        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* 副标题 */
        h2 {
            font-size: 1.2rem;
            font-weight: 300;
            color: #d4af37; /* 金色点缀，体现专业感 */
            margin-bottom: 2rem;
            letter-spacing: 4px;
        }

        /* 服务标签容器 */
        .services {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        /* 服务胶囊标签 */
        .tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(212, 175, 55, 0.2); /* 金色高亮 */
            border-color: #d4af37;
            color: #fff;
            transform: translateY(-2px);
        }

        /* 建设中状态条 */
        .status-bar {
            margin-top: 2rem;
            text-align: left;
        }
        
        .status-text {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bg {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            width: 75%; /* 进度百分比 */
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #fefefe);
            border-radius: 2px;
            animation: shimmer 2s infinite linear;
            background-size: 200% 100%;
        }

        /* 联系方式区域 */
        .contact {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: #888;
        }
        
        .contact a {
            color: #fff;
            text-decoration: none;
            border-bottom: 1px dotted #888;
            transition: color 0.3s;
        }
        
        .contact a:hover {
            color: #d4af37;
            border-bottom: 1px solid #d4af37;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .container { padding: 2rem; }
        }
    </style>
</head>
<body>

    <canvas id="waveCanvas"></canvas>

    <main class="container">
        <h1>HeRoStudio</h1>
        <h2>Professional Audio Production</h2>
        
        <div class="services">
            <span class="tag">🎶 编曲 Arranging</span>
            <span class="tag">🎚️ 混音 Mixing</span>
            <span class="tag">💿 母带 Mastering</span>
        </div>

        <div class="status-bar">
            <div class="status-text">
                <span>WEBSITE UPGRADE IN PROGRESS</span>
                <span>85%</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="contact">
            <p>网站正在极速搭建中...</p>
            <p style="margin-top:10px">合作咨询请联系：<a href="mailto:contact@herostudio.top">contact@herostudio.com</a></p>
        </div>
    </main>

    <script>
        // 声波背景动画逻辑
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let waves = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            // 创建三条不同频率的波浪
            waves = [
                { y: height / 2, length: 0.01, amplitude: 50, frequency: 0.01, color: 'rgba(212, 175, 55, 0.1)' }, // 金色
                { y: height / 2, length: 0.006, amplitude: 70, frequency: 0.015, color: 'rgba(255, 255, 255, 0.05)' }, // 白色
                { y: height / 2, length: 0.003, amplitude: 30, frequency: 0.02, color: 'rgba(100, 100, 255, 0.05)' }  // 蓝紫色
            ];
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, width, height);

            waves.forEach((wave, i) => {
                ctx.beginPath();
                ctx.moveTo(0, wave.y);

                for (let x = 0; x < width; x++) {
                    // 正弦波公式：y = A * sin(B * x + C) + D
                    const dx = x * wave.length;
                    const dy = Math.sin(dx + wave.frequency) * wave.amplitude;
                    ctx.lineTo(x, wave.y + dy);
                }

                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.fillStyle = wave.color;
                ctx.fill();

                // 让波浪动起来
                wave.frequency += 0.03 + (i * 0.01); 
            });
        }

        // 监听窗口大小变化
        window.addEventListener('resize', init);

        // 启动
        init();
        animate();
    </script>
</body>
</html>
